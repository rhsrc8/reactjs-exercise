<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family:Arial;
        margin-top:0px;
        margin-bottom:0px;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color:white;
        padding: 12px 20px;
        margin-left: 10px;
        border:none;
        border-radius:10px;
        font-size:15px;
        cursor:pointer;
        flex-grow:1;
      }
      .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width:1px;
        font-size:15px;
        flex-grow:1;
      }
      .chat-input-container{
        display:flex;
        margin-bottom:60px;

      }
      .app-container{
        max-width:600px;
        margin-left:auto;
        margin-right:auto;
        height:100vh;
        display:flex ;
        flex-direction: column;
      }
      .chat-message-user{
        display:flex;
        justify-content:end;
          align-items: start;
      
      }
      .chat-message-robot{
        display:flex;
        align-items: start;
      }
      
      .chat-message-text{
        background-color: rgb(238,238,238);
        padding:15px 20px;
        border-radius:10px;
        margin-right:10px;
        margin-right: 10px;
        margin-bottom:20px;
        max-width:300px;
      }
      .chat-message-profile{
        width:45px;

      }
      .chat-messages-container{
        flex-grow:1;
        margin-top:20px ;
        overflow:scroll;
        scrollbar-width:none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


      function ChatInput({chatMessages,setChatMessages}) {
        const [inputText,setInputText]=React.useState('');

        function saveInputText(event){
          setInputText(event.target.value);
        }

          function sendMessage(){
          const newChatMessages=[
            ...chatMessages,
            {
              message:inputText,
              sender:'user',
              id: crypto.randomUUID()  
            }

            ];
            setChatMessages(newChatMessages);


          const response = Chatbot.getResponse(inputText);
            
            setChatMessages([
            ...newChatMessages,
            {
              message:response,
              sender:'robot',
              id: crypto.randomUUID()  
            }

            ]);


            setInputText('');
          }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
            />
            <button onClick = {sendMessage} 
            className="send-button">Send</button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        // const message = props.message;
        // const sender = props.sender;
        // const { message, sender } = props;

        /*
        if (sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50" />
              {message}
            </div>
          );
        }
        */

        return (
          <div className={sender=== 'user'
          ?'chat-message-user'
          :'chat-message-robot'}>
            {sender === 'robot' && (
              <img src="robot.png" className="chat-message-profile" />
            )}
            <div className="chat-message-text">
            {message}
            </div>
            {sender === 'user' && (
              <img src="user.png" className="chat-message-profile"  />
            )}
          </div>
        );
      }
      function  ChatMessages({chatMessages}){

        const chatMessagesRef= React.useRef(null);

        React.useEffect(()=>{
        const containerElem= chatMessagesRef.current;
        if(containerElem){
          containerElem.scrollTop=containerElem.scrollHeight;
        }
          
        },[chatMessages]);


          return(
            <div className="chat-messages-container" ref= {chatMessagesRef}>
              
              {chatMessages.map((chatMessage)=>{
                return (<ChatMessage
                  message= {chatMessage.message}
                  sender= {chatMessage.sender}
                  key={chatMessage.id}
                />);

              }) }
            </div>
          )
      }
      function LoginForm({ onLogin }) {
      // 1. Şifre görünürlüğü için state
      const [showPassword, setShowPassword] = React.useState(false);

      // 2. Inputlara yazılanları takip etmek için yeni state'ler (Bunu ekledik!)
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');


      function loginControl() {
      const testEmail = "test@mail.com";
      const testPassword = "123";

      if (email === testEmail && password === testPassword) {
        onLogin(); // Eğer doğruysa App'teki setIsLoggedIn(true) çalışır
      } else {
        alert("Hatalı giriş! (İpucu: test@mail.com / 123)");
      }
    }
        return (
          <div className="login-container-style"> {/* Genel bir kapsayıcı ekledik */}
            <div className="login-form">
              <input 
                type="email"
                placeholder="Email"
                className="login-input"
                value={email} // State'e bağladık
                onChange={(e) => setEmail(e.target.value)} // Yazıldıkça state güncellenir
              />
            </div>

            <div className="password-container">
              <input
                type={showPassword ? 'text' : 'password'}
                placeholder="Password"
                className="login-input"
                value={password} // State'e bağladık
                onChange={(e) => setPassword(e.target.value)}
              />
              {/* Sadece şifreyi gösterip gizleyen küçük buton */}
              <button 
                type="button" 
                onClick={() => setShowPassword(!showPassword)}
                style={{ marginLeft: '-50px', cursor: 'pointer' }}
              >
                {showPassword ? 'Hide' : 'Show'}
              </button>
            </div>

            <div style={{ marginTop: '20px' }}>
              {/* Asıl giriş yapmamızı sağlayan buton */}
              <button 
                className="login-button" 
                onClick={loginControl} // App fonksiyonundaki setIsLoggedIn(true)'yu çalıştırır
              >
                Login
              </button>
              
              <button className="login-button">Sign up</button>
            </div>
          </div>
        );
      }
      
     function App() {
  // 1. Giriş durumunu takip eden yeni state
  const [isLoggedIn, setIsLoggedIn] = React.useState(false);

  // 2. Senin mevcut mesaj state'in (Olduğu gibi bıraktık)
  const [chatMessages, setChatMessages] = React.useState([
    { message: 'hello chatbot', sender: 'user', id: 'id1' },
    { message: 'Hello! How can I help you?', sender: 'robot', id: 'id2' },
    { message: 'can you get me todays date?', sender: 'user', id: 'id3' },
    { message: 'Today is September 27', sender: 'robot', id: 'id4' }
  ]);

  // 3. KOŞUL: Eğer giriş yapılmadıysa sadece Login formunu göster
  if (!isLoggedIn) {
    return (
      <div className="login-container">
        <LoginForm onLogin={() => setIsLoggedIn(true)} />
      </div>
    );
  }

  // 4. EĞER GİRİŞ YAPILDIYSA: mevcut Chatbot arayüzün çalışır
  return (
    <div className="app-container">
      {/* Çıkış butonu eklemek istersen buraya koyabilirsin */}
      <button 
        onClick={() => setIsLoggedIn(false)} 
        style={{alignSelf: 'flex-end', margin: '10px'}}
      >
        Logout
      </button>

      <ChatMessages chatMessages={chatMessages} />
      <ChatInput 
        chatMessages={chatMessages} 
        setChatMessages={setChatMessages} 
      />
    </div>
  );
}
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
